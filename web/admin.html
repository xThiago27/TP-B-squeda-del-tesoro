<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel del organizador</title>
<style>body{font-family:system-ui,sans-serif;background:#0d1117;color:#e6edf3;margin:0 auto;padding:14px;max-width:900px}
.card{background:#161b22;border-radius:12px;padding:12px;margin:10px 0;overflow-x:auto}input{padding:9px;border-radius:8px;border:0;margin:3px}
button{background:#238636;color:#fff;border:0;border-radius:8px;padding:10px 14px;margin:3px}button.r{background:#da3633}
table{width:100%;font-size:.85rem;border-collapse:collapse}td,th{padding:4px;text-align:left;border-bottom:1px solid #30363d}</style></head><body>
<h2>Panel del organizador</h2>
<div class="card" id="login"><input id="em" placeholder="Email"><input id="pw" type="password" placeholder="Contraseña"><button onclick="entrar()">Entrar</button></div>
<div id="panel" hidden>
 <div class="card">Partida: <input id="cod" value="PLAZA-2026"> <button onclick="cargar()">Actualizar</button> <button class="r" onclick="reiniciar()">Reiniciar partida</button></div>
 <div class="card"><h3>Equipos (borrar uno si se equivocó al registrarse)</h3><div id="eqs"></div></div>
 <div class="card"><h3>Ranking</h3><div id="rank"></div></div>
 <div class="card"><h3>Participantes (datos personales)</h3><div id="parts"></div></div>
 <div class="card"><h3>Últimos eventos de llegada</h3><div id="logs"></div></div>
</div>
<script>
const URL_SB='https://yzhqlkcbyffrmkthxxbu.supabase.co', KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl6aHFsa2NieWZmcm1rdGh4eGJ1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIxMjk0OTEsImV4cCI6MjEwNzcwNTQ5MX0.fvtNk-eVofsxZ4gA4jOoz_KUte7gddvBMd52jCl6bK4';
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let TOK=null;const H=()=>({apikey:KEY,Authorization:'Bearer '+TOK,'Content-Type':'application/json'});
async function entrar(){const r=await fetch(URL_SB+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email:$('em').value,password:$('pw').value})});
 const j=await r.json();if(!r.ok)return alert(j.error_description||j.msg||'No se pudo entrar');TOK=j.access_token;$('login').hidden=true;$('panel').hidden=false;cargar();setInterval(cargar,15000);}
const get=async p=>(await fetch(URL_SB+'/rest/v1/'+p,{headers:H()})).json();
const tabla=(cols,rows)=>'<table><tr>'+cols.map(c=>'<th>'+c+'</th>').join('')+'</tr>'+rows.map(r=>'<tr>'+r.map(x=>'<td>'+esc(x)+'</td>').join('')+'</tr>').join('')+'</table>';
const fmt=s=>Math.floor(s/60)+' min '+Math.floor(s%60)+' s';
async function cargar(){
 const c=$('cod').value;
 const rk=await (await fetch(URL_SB+'/rest/v1/rpc/ranking',{method:'POST',headers:H(),body:JSON.stringify({p_codigo:c})})).json();
 $('rank').innerHTML=tabla(['#','Equipo','Puntos completados','Puntaje','Tiempo'],rk.map((x,i)=>[i+1,x.nombre,x.completados,x.puntaje,fmt(x.segundos)]));
 const eq=await get('equipos?select=id,nombre,completados,puntaje&order=nombre');
 if(!String(document.activeElement&&document.activeElement.id).startsWith('pt'))
 $('eqs').innerHTML='<table>'+eq.map(e=>`<tr><td>${esc(e.nombre)}</td><td>${e.completados} puntos</td><td><input type="number" id="pt${e.id}" min="1" max="12" placeholder="punto" style="width:70px"><button onclick="irA('${e.id}')">Ir</button></td><td><button class="r" onclick="borrarEq('${e.id}')">Borrar</button></td></tr>`).join('')+'</table>';
 const ps=await get('participantes?select=nombre,apellido,edad,telefono,instagram,autorizacion_tutor,equipos(nombre)');
 $('parts').innerHTML=tabla(['Equipo','Nombre','Edad','Teléfono','Instagram','Tutor'],ps.map(p=>[p.equipos?.nombre,p.nombre+' '+p.apellido,p.edad,p.telefono,p.instagram,p.autorizacion_tutor?'sí':'']));
 const lg=await get('registros_llegada?select=punto_id,fecha_hora,distancia_m,precision_m,es_valido,uso_codigo_respaldo,equipos(nombre)&order=fecha_hora.desc&limit=40');
 $('logs').innerHTML=tabla(['Hora','Equipo','Punto','Dist. (m)','Precisión (m)','Válido','Respaldo'],lg.map(l=>[new Date(l.fecha_hora).toLocaleTimeString(),l.equipos?.nombre,l.punto_id,Math.round(l.distancia_m),Math.round(l.precision_m??0),l.es_valido?'sí':'no',l.uso_codigo_respaldo?'sí':'']));}
async function irA(id){const n=+document.getElementById('pt'+id).value;if(!n)return;if(!confirm('¿Mover el equipo al punto '+n+'?'))return;
 const r=await fetch(URL_SB+'/rest/v1/rpc/mover_equipo',{method:'POST',headers:H(),body:JSON.stringify({p_equipo:id,p_punto:n})});
 if(!r.ok)alert((await r.json()).message||'Error');cargar();}
async function borrarEq(id){if(!confirm('¿Borrar este equipo y los datos de sus participantes?'))return;
 await fetch(URL_SB+'/rest/v1/rpc/borrar_equipo',{method:'POST',headers:H(),body:JSON.stringify({p_equipo:id})});cargar();}
async function reiniciar(){if(!confirm('Esto BORRA todos los equipos y los datos personales de la partida. ¿Seguro?'))return;
 await fetch(URL_SB+'/rest/v1/rpc/reiniciar_partida',{method:'POST',headers:H(),body:JSON.stringify({p_codigo:$('cod').value})});cargar();}
</script></body></html>
